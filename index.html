<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111820">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="鏡の啓示">
  <title>鏡の啓示</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app-shell">
    <section id="startScreen" class="screen start-screen" aria-labelledby="appTitle">
      <h1 id="appTitle" class="app-title">鏡の啓示</h1>
      <button id="drawButton" class="card-back-button" aria-label="一枚ひらく">
        <span class="card-back">
          <span class="back-ring" aria-hidden="true"></span>
        </span>
      </button>
      <button id="drawTextButton" class="primary-action">一枚、ひらく</button>
      <p class="quiet-copy">49の断片から、いまの一枚を。</p>
    </section>

    <section id="cardScreen" class="screen card-screen" hidden>
      <div class="card-stage">
        <button id="oracleCard" class="oracle-card" aria-label="カードをタップして言葉を読む">
          <span class="card-inner">
            <span class="card-face card-front">
              <span id="frontArt" class="front-art">
                <img id="frontSigil" class="front-sigil" alt="" aria-hidden="true">
                <span class="placeholder-silhouette" aria-hidden="true"></span>
              </span>
              <span class="title-band"><span id="frontTitle"></span></span>
            </span>

            <span class="card-face card-message">
              <span class="parchment-layer"></span>
              <img id="messageSigil" class="message-sigil" alt="" aria-hidden="true">
              <span class="message-content">
                <span id="messageTitle" class="message-title"></span>
                <span class="message-divider" aria-hidden="true">✦</span>
                <span id="messageText" class="message-text"></span>
              </span>
            </span>
          </span>
        </button>
      </div>

      <p id="tapHint" class="tap-hint">カードをタップして言葉を読む</p>
      <button id="redrawButton" class="secondary-action">もう一枚引く</button>
    </section>
  </main>

  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
